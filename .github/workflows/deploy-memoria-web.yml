# Deploys Memoria Web to an Azure App Service. Run it by hand from the Actions tab; nothing else
# triggers it. Everything that names your Azure — tenant, subscription, identity, app — lives in the
# GitHub Environment you pick, so the file itself carries nothing and a fork can point it elsewhere.
#
# The Environment needs three secrets and one variable:
#   AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_CLIENT_ID   (secrets)  the identity GitHub signs in as
#   AZURE_WEBAPP_NAME                                         (variable) the App Service to deploy to
#
# The identity is a user-assigned managed identity, or an app registration, with a federated
# credential trusting this repository's Environment, and Website Contributor on the app. No password
# or publish profile is stored anywhere. See docs/tools/memoria-web-deployment.md.
name: Deploy Memoria Web

on:
  workflow_dispatch:
    inputs:
      environment:
        description: The GitHub Environment that holds the Azure identity and the App Service name
        type: environment
        required: true
        default: production

# id-token lets the job ask GitHub for the OpenID Connect token azure/login exchanges for Azure
# credentials. contents:read is all the checkout needs.
permissions:
  contents: read
  id-token: write

# Two deployments to the same Environment queue rather than race; the later one is not cancelled,
# so the last thing asked for is the last thing deployed.
concurrency:
  group: deploy-memoria-web-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Publish output, not build output: only publish output carries the static-asset bundle the
      # application serves outside Development. Framework-dependent, so the App Service runtime
      # provides ASP.NET Core 10 and the package stays small.
      - name: Publish
        run: dotnet publish src/Memoria.Web --configuration Release --output ./publish

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./publish
