title: Memoria
description: DDD, CQRS and Event Sourcing framework for .NET.
url: https://lucabriguglia.github.io
baseurl: /Memoria

remote_theme: just-the-docs/just-the-docs@v0.12.0

plugins:
  - jekyll-remote-theme
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-include-cache

# Every page uses the theme's default layout, so no page has to declare one.
defaults:
  - scope:
      path: ""
    values:
      layout: default

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
enable_copy_code_button: true

color_scheme: light

aux_links:
  GitHub: https://github.com/lucabriguglia/Memoria
  NuGet: https://www.nuget.org/packages/Memoria
aux_links_new_tab: true

# Available to any page as `{: .note }` or `{: .warning }` under a paragraph.
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red

# The footer itself is _includes/footer_custom.html; site.footer_content is no
# longer read by the theme.
gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/lucabriguglia/Memoria
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
